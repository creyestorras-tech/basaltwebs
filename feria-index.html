<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>REIGN — MEDICA Düsseldorf 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#f0f2f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#1a2236;min-height:100vh;font-size:15px}

/* TOPBAR */
.topbar{background:#1a2236;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:14px}
.topbar-logo{height:30px;object-fit:contain}
.topbar-title{font-size:14px;color:rgba(255,255,255,0.7);font-weight:400}
.topbar-badge{background:#daaa00;color:#1a2236;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:0.3px}
.offline-badge{background:#22c55e;color:#fff;border-radius:999px;padding:3px 10px;font-size:10px;font-weight:600}

/* TABS */
.tabs-bar{background:#fff;border-bottom:2px solid #e5e9f2;padding:0 20px;display:flex;gap:0}
.tab{padding:16px 24px 14px;font-size:14px;font-weight:600;color:#7a8aaa;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all 0.15s;user-select:none}
.tab:hover{color:#1a2236}
.tab.active{color:#daaa00;border-bottom-color:#daaa00}
.tab-icon{margin-right:6px}

/* MAIN */
.main{padding:16px 20px;max-width:1200px;margin:0 auto}
.tab-content{display:none}
.tab-content.active{display:block}

/* SEARCH BAR */
.search-wrap{position:relative;margin-bottom:16px}
.search-input{width:100%;padding:14px 16px 14px 44px;font-size:16px;border:2px solid #e5e9f2;border-radius:12px;background:#fff;color:#1a2236;outline:none;transition:border-color 0.15s;font-family:inherit}
.search-input:focus{border-color:#daaa00}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#aab2c8}

/* CLIENT CARDS */
.client-list{display:flex;flex-direction:column;gap:8px}
.client-card{background:#fff;border:2px solid #e5e9f2;border-radius:12px;overflow:hidden;transition:border-color 0.15s;cursor:pointer}
.client-card:hover,.client-card.open{border-color:#daaa00}
.client-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:12px}
.client-name{font-size:15px;font-weight:600;color:#1a2236;flex:1}
.client-vols{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vol-chip{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.vol-chip.y26{background:#fef9ec;color:#92650a;border:1px solid #fde68a}
.vol-chip.y25{background:#f0f4ff;color:#2563eb;border:1px solid #bfdbfe}
.vol-chip.y24{background:#f4f4f8;color:#7a8aaa;border:1px solid #e5e9f2}
.vol-chip.zero{background:#fafafa;color:#ccc;border:1px solid #eee}
.client-arrow{font-size:14px;color:#aab2c8;transition:transform 0.2s;flex-shrink:0}
.client-card.open .client-arrow{transform:rotate(90deg)}

/* DETAIL PANEL */
.client-detail{display:none;border-top:2px solid #f0f2f8;padding:0 18px 18px}
.client-card.open .client-detail{display:block}
.detail-tabs{display:flex;gap:0;border-bottom:1px solid #e5e9f2;margin-bottom:14px;margin-top:14px}
.dtab{padding:9px 16px;font-size:12px;font-weight:600;color:#7a8aaa;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s}
.dtab.active{color:#1a2236;border-bottom-color:#daaa00}
.dtab-content{display:none}
.dtab-content.active{display:block}

/* PRODUCT TABLE */
.prod-table{width:100%;border-collapse:collapse;font-size:13px}
.prod-table th{padding:8px 10px;text-align:left;font-size:10px;font-weight:600;color:#7a8aaa;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid #e5e9f2;background:#fafbff}
.prod-table th.r{text-align:right}
.prod-table th.sort-th{cursor:pointer;user-select:none;white-space:nowrap}
.prod-table th.sort-th:hover{background:#f0f4ff;color:#2563eb}
.prod-table td{padding:8px 10px;border-bottom:1px solid #f0f2f8;vertical-align:top}
.prod-table td.r{text-align:right;font-variant-numeric:tabular-nums;color:#1a2236;font-weight:500}
.prod-table tr:last-child td{border-bottom:none}
.prod-table tr:hover td{background:#fafbff}
.prod-name{font-size:12px;color:#1a2236;line-height:1.4}
.prod-ref{font-size:10px;color:#aab2c8}
.trend-up{color:#16a34a;font-size:11px}
.trend-dn{color:#dc2626;font-size:11px}
.trend-eq{color:#aab2c8;font-size:11px}
.year-total-row{background:#fafbff;font-weight:700}

/* NOTES AREA */
.notes-area{margin-top:14px}
.notes-label{font-size:11px;font-weight:600;color:#7a8aaa;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.notes-textarea{width:100%;height:140px;padding:12px;font-size:14px;border:2px solid #e5e9f2;border-radius:10px;font-family:inherit;resize:vertical;color:#1a2236;line-height:1.6;background:#fff;outline:none;transition:border-color 0.15s}
.notes-textarea:focus{border-color:#daaa00}
.notes-save{margin-top:8px;display:flex;align-items:center;gap:10px}
.btn{padding:9px 20px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all 0.15s}
.btn-gold{background:#daaa00;color:#1a2236;border-color:#daaa00}
.btn-gold:hover{background:#c49800}
.btn-outline{background:#fff;color:#4a5a7a;border-color:#dde2ef}
.btn-outline:hover{border-color:#daaa00;color:#92650a}
.saved-ts{font-size:11px;color:#aab2c8}

/* SUPPLIER TAB */
.supplier-list{display:flex;flex-direction:column;gap:8px}
.supplier-card{background:#fff;border:2px solid #e5e9f2;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color 0.15s}
.supplier-card:hover,.supplier-card.open{border-color:#2563eb}
.supplier-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:12px}
.supplier-name{font-size:15px;font-weight:600;color:#1a2236;flex:1}
.supplier-detail{display:none;border-top:2px solid #f0f2f8;padding:16px 18px}
.supplier-card.open .supplier-detail{display:block}
.supplier-card.open .client-arrow{transform:rotate(90deg)}

/* SUPPLIER BARS */
.year-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.year-label{width:36px;font-size:11px;font-weight:600;color:#7a8aaa;flex-shrink:0}
.bar-wrap{flex:1;height:28px;background:#f0f2f8;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:600;color:#1a2236;min-width:40px;transition:width 0.4s ease}
.bar-26{background:#daaa00}
.bar-25{background:#93c5fd}
.bar-24{background:#e5e9f2;color:#7a8aaa}
.bar-label{width:90px;text-align:right;font-size:12px;font-weight:600;color:#1a2236;flex-shrink:0}

/* AGENDA */
.agenda-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.agenda-day{background:#fff;border-radius:12px;overflow:hidden;border:2px solid #e5e9f2}
.agenda-day-hdr{padding:11px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.agenda-day-hdr.gold{background:#1a2236;color:#daaa00}
.agenda-day-hdr.blue{background:#daaa00;color:#1a2236}
.agenda-items{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.agenda-item{border:1.5px solid #e5e9f2;border-radius:9px;padding:10px 13px;cursor:pointer;transition:all 0.15s;background:#fff}
.agenda-item:hover,.agenda-item.clickable:hover{border-color:#daaa00;background:#fefce8}
.agenda-item.no-click{cursor:default}
.agenda-item.no-click:hover{border-color:#e5e9f2;background:#fff}
.agenda-time{font-size:10px;font-weight:700;color:#2563eb;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px}
.agenda-subj{font-size:13px;font-weight:600;color:#1a2236}
.agenda-sub{font-size:11px;color:#7a8aaa;margin-top:3px;line-height:1.4}
.agenda-hint{font-size:10px;color:#daaa00;font-weight:600;margin-top:5px}

/* EMPTY STATE */
.empty{padding:40px;text-align:center;color:#aab2c8;font-size:14px}

/* SUMMARY BAR */
.summary-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.sbar-item{background:#fff;border-radius:10px;padding:12px;text-align:center;border:2px solid #e5e9f2}
.sbar-val{font-size:22px;font-weight:700;color:#1a2236}
.sbar-lbl{font-size:10px;color:#7a8aaa;margin-top:3px}

/* SECTION HEADER */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:13px;font-weight:700;color:#4a5a7a;text-transform:uppercase;letter-spacing:0.5px}

/* RESPONSIVE */
@media(max-width:600px){
  .topbar{padding:0 14px;height:52px}
  .main{padding:12px 12px}
  .tab{padding:13px 14px 11px;font-size:13px}
  .summary-bar{grid-template-columns:repeat(3,1fr)}
  .client-vols{gap:5px}
}
</style>
</head>

</div><!-- /main -->

function lsGet(k){ try{ return JSON.parse(localStorage.getItem('medica26_'+k)||'null'); }catch(e){ return null; } }

// HELPERS
// ═══════════════════════════════════════════
function fmt(v){ if(!v||v===0) return '—'; return new Intl.NumberFormat('es-ES',{minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(v))+' €'; }
function fmtTs(ts){ if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('es-ES')+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }

function trendIcon(a,b){
  if(!a||!b) return '<span class="trend-eq">—</span>';
  const r=(b-a)/a*100;
  if(r>10) return '<span class="trend-up">▲ '+r.toFixed(0)+'%</span>';
  if(r<-10) return '<span class="trend-dn">▼ '+Math.abs(r).toFixed(0)+'%</span>';
  return '<span class="trend-eq">≈ '+r.toFixed(0)+'%</span>';
}

function norm(s){ return s.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]/g,' ').trim(); }

// ═══════════════════════════════════════════
// BUILD SUPPLIER PURCHASE DATA from STATIC_LINES
// ═══════════════════════════════════════════
function buildSupplierPurchaseData(){
  const map = {};
  for(const l of STATIC_LINES){
    if(!l.cl || !l.y || l.v <= 0) continue;
    const cl = l.cl.trim();
    if(!map[cl]) map[cl] = { products:{} };
    const pk = (l.ref||l.p||'').trim() || l.p;
    if(!map[cl].products[pk]) map[cl].products[pk] = { name:l.p, ref:l.ref||'', cat:l.c||'', years:{} };
    if(!map[cl].products[pk].years[l.y]) map[cl].products[pk].years[l.y] = 0;
    map[cl].products[pk].years[l.y] += l.v;
  }
  return map;
}
let SUPPLIER_PURCHASE_DATA = null;
function getSupplierPurchaseData(){
  if(!SUPPLIER_PURCHASE_DATA) SUPPLIER_PURCHASE_DATA = buildSupplierPurchaseData();
  return SUPPLIER_PURCHASE_DATA;
}

// ═══════════════════════════════════════════
// BUILD CLIENT DATA from STATIC_LINES
// ═══════════════════════════════════════════
function buildClientData(){
  const map = {};
  for(const l of STATIC_LINES){
    if(!l.cl || !l.y || l.v <= 0) continue;
    const cl = normalizeClient(l.cl);
    if(!map[cl]) map[cl] = { name:cl, years:{}, products:{} };
    if(!map[cl].years[l.y]) map[cl].years[l.y] = 0;
    map[cl].years[l.y] += l.v;
    // products by name+ref
    const pk = (l.ref||l.p||'').trim() || l.p;
    if(!map[cl].products[pk]) map[cl].products[pk] = { name:l.p, ref:l.ref||'', cat:l.c||'', years:{} };
    if(!map[cl].products[pk].years[l.y]) map[cl].products[pk].years[l.y] = 0;
    map[cl].products[pk].years[l.y] += l.v;
  }
  // Sort by 2025+2026 volume desc
  return Object.values(map).sort((a,b) => {
    const va = (a.years[2025]||0)+(a.years[2026]||0);
    const vb = (b.years[2025]||0)+(b.years[2026]||0);
    return vb-va;
  });
}

function jumpToClient(key, tab){
  // Find which tab to use — argument takes priority, then auto-detect
  const targetTab = tab || 'clientes';
  const tabIndex = targetTab === 'proveedores' ? 2 : 1;
  const contentId = 'tab-' + targetTab;
  const cardSelector = targetTab === 'proveedores' ? '.supplier-card' : '.client-card';
  const headerSelector = targetTab === 'proveedores' ? '.supplier-header' : '.client-header';

  // Switch tab
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab')[tabIndex].classList.add('active');
  document.getElementById(contentId).classList.add('active');

  // Fuzzy search
  const n = norm(key);
  const words = n.split(' ').filter(w=>w.length>3);
  const cards = document.querySelectorAll(cardSelector);
  let found = null;
  cards.forEach(card => {
    const cardName = norm(card.dataset.name||'');
    if(!found && (words.length===0 || words.some(w=>cardName.includes(w)))) found = card;
  });
  if(found){
    if(!found.classList.contains('open')) found.querySelector(headerSelector).click();
    setTimeout(()=>found.scrollIntoView({behavior:'smooth',block:'start'}),150);
  }
}

// Sort product table by year column
function sortProdTable(tableId, year){
  const table = document.getElementById(tableId);
  if(!table) return;
  const colIndex = year===2024?1 : year===2025?2 : 3;
  const ths = table.querySelectorAll('thead th.sort-th');
  // Determine sort direction
  const th = ths[colIndex-1];
  const asc = th.dataset.sortCol !== String(year) || th.dataset.sortDir === 'desc';
  // Reset all headers
  ths.forEach(h => { h.dataset.sortCol=''; h.dataset.sortDir=''; h.querySelector('.sort-icon').textContent=''; });
  th.dataset.sortCol = year;
  th.dataset.sortDir = asc ? 'asc' : 'desc';
  th.querySelector('.sort-icon').textContent = asc ? ' ▲' : ' ▼';
  // Sort rows
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr')).filter(r=>r.cells.length>1);
  rows.sort((a,b) => {
    const va = parseFloat(a.cells[colIndex].dataset.value)||0;
    const vb = parseFloat(b.cells[colIndex].dataset.value)||0;
    return asc ? va-vb : vb-va;
  });
  rows.forEach(r => tbody.appendChild(r));
}

function toggleSupplier(card){
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('.supplier-card.open').forEach(c=>c.classList.remove('open'));
  if(!wasOpen) card.classList.add('open');
}

function saveProvNota(provName){
  const safeId = provName.replace(/[^a-z0-9]/gi,'_');
  const textarea = document.getElementById('pnota-'+safeId);
  if(!textarea) return;
  lsSet('prov_notas_'+provName, {text:textarea.value});
  lsSet('prov_notas_ts_'+provName, Date.now());
  const ts = document.getElementById('pnota-ts-'+safeId);
  if(ts) ts.textContent = 'Guardado: '+fmtTs(Date.now());
}

function exportAll(){
  const lines = ['REIGN REAGENTS — MEDICA Düsseldorf 2026', '='.repeat(50), ''];
  
  // Agenda notes
  const an = lsGet('agenda_notas');
  if(an && an.text){ lines.push('NOTAS GENERALES FERIA','─'.repeat(30), an.text, ''); }
  
  // Client notes
  lines.push('NOTAS POR CLIENTE','─'.repeat(30));
  CLIENT_DATA.forEach(c => {
    const n = lsGet('client_notas_'+c.name);
    if(n && n.text){
      lines.push('', '▶ '+c.name, n.text);
    }
  });
  
  // Supplier notes
  lines.push('', 'NOTAS POR PROVEEDOR', '─'.repeat(30));
  SUPPLIER_DATA.forEach(s => {
    const n = lsGet('prov_notas_'+s.p);
    if(n && n.text){
      lines.push('', '▶ '+s.p, n.text);
    }
  });

  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'medica2026_notas.txt';
  a.click();
}

// SYNC FROM ODOO (requires Vercel proxy)
// ═══════════════════════════════════════════
let UID=null, SESSION='', COMPANY_ID=null;
const PROXY = '/api/odoo';

function syncProgress(msg, pct){
  document.getElementById('syncMsg').textContent = msg;
  document.getElementById('syncBar').style.width = pct+'%';
}

async function syncFromOdoo(){
  // Check online
  if(!navigator.onLine){
    alert('Sin conexión a internet. El panel funciona en modo offline con los datos estáticos.');
    return;
  }
  // Check if served from Vercel (not file://)
  if(location.protocol === 'file:'){
    alert('Para sincronizar datos, abre este panel desde el servidor Vercel, no como archivo local.');
    return;
  }

  const overlay = document.getElementById('syncOverlay');
  overlay.style.display = 'flex';
  syncProgress('Autenticando con Odoo...', 15);

  try {
    // Authenticate
    const authRes = await fetch(PROXY, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'authenticate'})
    });
    const authData = await authRes.json();
    if(!authData.uid) throw new Error('Autenticación fallida');
    UID = authData.uid; SESSION = authData.session||'';
    syncProgress('Obteniendo empresa...', 30);

    // Get company
    const userRes = await fetch(PROXY, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'search_read', params:{
        uid:UID, session:SESSION, model:'res.users',
        domain:[['id','=',UID]], fields:['company_id'], limit:1
      }})
    });
    const userData = await userRes.json();
    COMPANY_ID = (userData.result&&userData.result[0]&&userData.result[0].company_id) ? userData.result[0].company_id[0] : null;
    syncProgress('Descargando pedidos de venta...', 50);

    // Fetch sale orders (last 3 years)
    const minDate = (new Date().getFullYear()-2)+'-01-01';
    const domain = [['state','in',['sale','done']],['date_order','>=',minDate]];
    if(COMPANY_ID) domain.push(['company_id','=',COMPANY_ID]);
    const ordersRes = await fetch(PROXY, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'search_read', params:{
        uid:UID, session:SESSION, model:'sale.order',
        domain, fields:['date_order','amount_untaxed','partner_id','name'], limit:10000
      }})
    });
    const ordersData = await ordersRes.json();
    const orders = ordersData.result||[];
    syncProgress('Procesando '+orders.length+' pedidos...', 65);

    // Build fresh CLIENT_DATA from orders
    const map = {};
    for(const o of orders){
      if(!o.partner_id) continue;
      const cl = o.partner_id[1]||'';
      const y = new Date(o.date_order).getFullYear();
      const v = o.amount_untaxed||0;
      if(!map[cl]) map[cl] = {name:cl, years:{}, products:{}};
      if(!map[cl].years[y]) map[cl].years[y] = 0;
      map[cl].years[y] += v;
    }
    // Replace CLIENT_DATA (keep existing products from STATIC_LINES for detail)
    const newClients = Object.values(map).sort((a,b)=>{
      const va=(a.years[2025]||0)+(a.years[2026]||0);
      const vb=(b.years[2025]||0)+(b.years[2026]||0);
      return vb-va;
    });
    // Merge products from STATIC_LINES into new clients
    const staticMap = {};
    for(const c of CLIENT_DATA) staticMap[norm(c.name)] = c.products||{};
    for(const c of newClients){
      const key = norm(c.name);
      if(staticMap[key]) c.products = staticMap[key];
    }
    CLIENT_DATA = newClients;

    // ── Descargar pedidos de compra (purchase.order) ──────────────────
    syncProgress('Descargando compras a proveedores...', 75);
    const minDateP = (new Date().getFullYear()-2)+'-01-01';
    const purchOrderDomain = [['state','in',['purchase','done']],['date_order','>=',minDateP]];
    if(COMPANY_ID) purchOrderDomain.push(['company_id','=',COMPANY_ID]);
    let purchOrders = [];
    try {
      const poRes = await fetch(PROXY, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'search_read', params:{
          uid:UID, session:SESSION, model:'purchase.order',
          domain: purchOrderDomain,
          fields:['id','partner_id','date_order','order_line'],
          limit:10000
        }})
      });
      const poData = await poRes.json();
      purchOrders = poData.result||[];
    } catch(e){ console.warn('Purchase orders fetch failed:', e.message); }

    // Build order→partner+year map
    const orderInfoMap = {}; // orderId → {suppName, year}
    for(const po of purchOrders){
      if(!po.partner_id) continue;
      const y = po.date_order ? new Date(po.date_order).getFullYear() : new Date().getFullYear();
      orderInfoMap[po.id] = { suppName: po.partner_id[1]||'', year: y };
    }

    // Now fetch the lines for those orders
    const purchOrderIds = purchOrders.map(o=>o.id);
    let purchLines = [];
    if(purchOrderIds.length > 0){
      try {
        const plRes = await fetch(PROXY, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({action:'search_read', params:{
            uid:UID, session:SESSION, model:'purchase.order.line',
            domain:[['order_id','in', purchOrderIds.slice(0,2000)]],
            fields:['order_id','product_id','price_subtotal','product_uom_qty'],
            limit:10000
          }})
        });
        const plData = await plRes.json();
        purchLines = plData.result||[];
      } catch(e){ console.warn('Purchase lines fetch failed:', e.message); }
    }

    syncProgress('Procesando '+purchLines.length+' líneas de compra...', 85);

    // Build supplier purchase map: supplierName → { products: { pk: {name,years} } }
    if(purchLines.length > 0){
      const suppMap = {};
      for(const l of purchLines){
        const oInfo = l.order_id ? orderInfoMap[l.order_id[0]] : null;
        if(!oInfo) continue;
        const suppName = oInfo.suppName;
        const y = oInfo.year;
        const prodName = l.product_id ? l.product_id[1] : '(sin producto)';
        const pk = l.product_id ? String(l.product_id[0]) : prodName;
        const v = l.price_subtotal||0;
        if(!suppMap[suppName]) suppMap[suppName] = {products:{}};
        if(!suppMap[suppName].products[pk]) suppMap[suppName].products[pk] = {name:prodName, ref:'', cat:'', years:{}};
        if(!suppMap[suppName].products[pk].years[y]) suppMap[suppName].products[pk].years[y] = 0;
        suppMap[suppName].products[pk].years[y] += v;
      }
      // Match to SUPPLIER_DATA by normalized name and inject _purchaseProds
      for(const s of SUPPLIER_DATA){
        const sn = norm(s.p);
        let match = suppMap[s.p];
        if(!match){
          for(const [k,v] of Object.entries(suppMap)){
            if(norm(k).includes(sn) || sn.includes(norm(k))){ match = v; break; }
          }
        }
        if(match){
          s._purchaseProds = Object.values(match.products)
            .filter(p=>(p.years[2024]||0)+(p.years[2025]||0)+(p.years[2026]||0)>0)
            .sort((a,b)=>((b.years[2026]||0)+(b.years[2025]||0))-((a.years[2026]||0)+(a.years[2025]||0)));
        }
      }
      SUPPLIER_PURCHASE_DATA = null;
    }

    syncProgress('Actualizando vistas...', 92);
    renderClientes();
    renderProveedores();
    syncProgress('✅ Datos actualizados correctamente', 100);
    setTimeout(()=>{ overlay.style.display='none'; }, 1500);

    // Update badge
    document.getElementById('syncBadge').textContent = '🟢 Datos Odoo';
    document.getElementById('syncBadge').style.background = '#16a34a';
    document.getElementById('syncBadge').style.color = '#fff';

  } catch(err) {
    syncProgress('❌ Error: '+err.message, 100);
    setTimeout(()=>{ overlay.style.display='none'; }, 2500);
  }
}

// Check online status on load

  const badge = document.getElementById('syncBadge');
  if(navigator.onLine && location.protocol !== 'file:'){
    badge.textContent = '🌐 Online';

    badge.style.color = '#16a34a';
  } else {
    badge.textContent = '📴 Sin internet';
  }
}
